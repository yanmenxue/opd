# 冒烟测试：0.5B 自蒸馏，2 轮打通全流程（完整配置，独立于 base.yaml）
teacher_model: "Qwen/Qwen2.5-0.5B-Instruct"
student_model: "Qwen/Qwen2.5-0.5B-Instruct"
work_dir: "./runs/smoke"
data_train: "gsm8k"
data_eval: "gsm8k_test"
data:
  max_questions: 64
  probe:
    enable: false        # 冒烟不过探，直接全量落盘
rounds:
  num_rounds: 2
  prompts_per_round: 16
  G: 4
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512
  max_seq_len: 1024
  eval_every: 0
grade:
  teacher_devices: [0, 1]
  student_devices: [0, 1]
  vocab_chunk: 16384
  step_window: 64
  ier_topk: 32
  teacher_sees_gold: true
train:
  ckpt_dir: "./ckpt_smoke"
  arm: "opd_acc"
  w_kl: 1.0
  lambda_acc: 1.0
  adv_norm: true
  lr: 1.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 10
  micro_batch: 2
  grad_accum: 2
  epochs: 1
  clip_eps: 0.2
  max_grad_norm: 1.0
  seed: 42
  select:
    mode: "sr_opsd"
    budget: 0.05
    gamma: 1.0
    alpha: 1.0
    min_tokens: 8
    correct_scale: 1.0
    norm_scope: "all"
eval:
  temperature: 0.0
  max_tokens: 512
  max_questions: 50
