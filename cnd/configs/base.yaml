# Causal-Credit OPSD（论文二）：反事实干预的步骤级信用分配蒸馏
# 用"步骤矛盾替换 → 答案是否翻转"测因果必要度，把蒸馏信号集中在因果必要步骤上。
# CND 分支 MC 保留为消融臂。算法详见 ../DESIGN_two_works.md §2.7

# ===== 模型 =====
teacher_model: "Qwen/Qwen3.5-4B"     # CND 规范设定：师生同 backbone
student_model: "Qwen/Qwen3.5-4B"

# ===== 路径与数据 =====
work_dir: "./runs/main"
data_train: "math"                   # MATH（训练）| gsm8k | jsonl:<path>
data_eval: "math500"                 # math500（主评测）| aime24 | aime25(~id未验证) | amc23 | gsm8k_test | jsonl:<path>
data:
  max_questions: 4000
  probe:                 # Phase 0 难度探针（推荐开；关掉则全量落盘）
    enable: true
    G: 4                 # 探针采样数
    keep: [1, 3]         # 保留 pass@G' ∈ [1,3]（中难度带；分支 MC 与组内优势都不退化）
    temperature: 0.8
    max_tokens: 1024

# ===== Round 循环 =====
rounds:
  num_rounds: 20
  prompts_per_round: 256
  G: 8
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 1024
  max_seq_len: 2048
  eval_every: 5

# ===== Phase 2: Causal-Credit 反事实干预（主方法）=====
cc:
  enable: true
  variants: 2            # 每步矛盾改写变体数（spec 单次=方差上界；>1 方差缩减，可消融回 1）
  intervention: "negate" # negate 逻辑反转 | factual 事实反转 | premise 前提否定（消融轴）
  min_rollout_tokens: 300 # rollout 长度下限（短链干预空间有限，spec）
  rewrite_max_tokens: 128 # 矛盾步骤改写长度上限
  max_tokens: 256        # 干预后重生成到答案
  temperature: 0.8
  top_p: 0.95
  max_steps: 0           # 每条 rollout 最多干预的步数（0=全部）

# ===== Phase 2(消融): CND 分支 MC =====
cnd:
  enable: false
  B: 4                   # 每步分支续写条数（价值分布样本量；ablation: 4 vs 8）
  temperature: 0.8
  top_p: 0.95
  max_tokens: 256        # 续写到答案的短 rollout 长度
  max_steps: 0           # 每条 rollout 最多测的步数（0=全部）
  only_correct: true     # 只对正确 rollout 构建价值分布（spec）

# ===== Phase 3: 打分 =====
grade:
  teacher_devices: [0, 1, 2, 3, 4, 5]
  student_devices: [6, 7]
  vocab_chunk: 16384      # RKL 分词表块计算（online logsumexp）
  micro_batch: 1
  step_window: 64         # tokenizer 对齐失败时步骤切分的回退窗口（token）
  teacher_sees_gold: true # 蒸馏目标 π_T(·|x,y*,·)；跨模型需同 tokenizer，可改 false

# ===== Phase 4: 训练 =====
train:
  ckpt_dir: "./ckpt"      # 学生 checkpoint 目录（与初始模型路径分离，防教师遮蔽）
  arm: "opd_acc"          # opd | opd_acc（规范形态 = opd_acc：加权 KL + λ·L_RL）
  w_kl: 1.0
  lambda_acc: 1.0
  adv_norm: true
  lr: 1.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 10
  micro_batch: 2
  grad_accum: 8
  epochs: 1
  clip_eps: 0.2
  max_grad_norm: 1.0
  seed: 42
  select:
    mode: "causal_credit" # causal_credit（主）| cnd（分支 MC 消融）| none（全量均匀）
    alpha: 1.0            # softmax(α·φ_k / α·N_k) 温度（权重集中度）
    correct_scale: 1.0

# ===== 评测 =====
eval:
  temperature: 0.0
  max_tokens: 1024
  max_questions: 500
